# Uncoached, the way the requester wrote it. The eval measures the skill;
# it must not teach the model the workflow (dev/goals/P4-eval-automation.md).
schema_version: "1.0"
name: permission-slip-japanese
tags: [form, cjk]
runs: 1
context:
  scaffold_script: |
    python3 evals/make_fixtures.py --outdir "$PWD/fixtures"
execution:
  prompt: |
    I have a school permission slip PDF at fixtures/permission_form.pdf that
    our Japanese-speaking families need. Can you translate it to Japanese?
    It's a fillable form and it needs to stay fillable — parents will type
    into it. The layout should look the same as the English one.
  max_turns: 150
  timeout_seconds: 2400
