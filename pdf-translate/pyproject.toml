[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-translate"
version = "53.0.0"
description = "Layout-faithful PDF translation with working form fields"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Rodrigo Arias"}]
dependencies = [
    "pymupdf>=1.24,<1.30",
    "pikepdf>=8.0,<11",
    "fonttools>=4.40,<5",
]

[tool.setuptools]
packages = ["pdf_translate"]
