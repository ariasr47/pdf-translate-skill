name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: pdf-translate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The shaping tests need real OFL faces with GSUB tables. They are
      # fetched, never committed; a fetch failure must not turn into a
      # silent skip, so the check step is separate and fatal.
      - name: Cache test fonts
        uses: actions/cache@v6
        with:
          path: pdf-translate/tests/fonts
          key: noto-fonts-v1

      - name: Fetch test fonts
        run: python tools/fetch_test_fonts.py

      - name: Verify test fonts are present
        run: python tools/fetch_test_fonts.py --check

      - name: Run the suite
        run: python -m unittest tests.test_pipeline tests.test_corpus_verdicts -v

      - name: Build the eval fixtures
        run: python evals/make_fixtures.py --outdir "${{ runner.temp }}/fixtures"

  package:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The repository root is a Claude Code plugin and a one-entry
      # marketplace (lane B row P2). Validation catches a misspelled field
      # or a stale source path before anyone installs from it.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin and marketplace manifests
        run: claude plugin validate . --strict

      # plugin.json's version is metadata.version as N.0.0. Users only get
      # an update when the plugin version changes, so bumping one without
      # the other ships nothing.
      - name: Plugin version matches metadata.version
        run: |
          python - <<'PY'
          import json, re
          plugin = json.load(open('.claude-plugin/plugin.json'))['version']
          text = open('pdf-translate/SKILL.md', encoding='utf-8').read()
          skill = re.search(r'^\s+version:\s*"(\d+)"', text, re.M).group(1)
          assert plugin == f'{skill}.0.0', f'plugin.json {plugin} vs metadata.version {skill}'
          print('plugin', plugin, '== metadata.version', skill)
          PY
